<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Segreteria ITSAR</title>
    <style>
        body { font-family: 'Helvetica Neue', sans-serif; padding: 20px; background: #f0f2f5; }
        .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .section-title { border-bottom: 2px solid #004a99; color: #004a99; padding-bottom: 5px; margin-bottom: 20px; }
        button { background: #004a99; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 25px; }
        button:disabled { background: #ccc; }
        
        /* SEZIONE LOGIN GIALLA */
        #loginBox { text-align: center; padding: 20px; background: #fff9c4; border-radius: 10px; border: 1px solid #fbc02d; }
        
        /* NASCONDIAMO IL MODULO ALL'INIZIO */
        #moduloSegreteria { display: none; }
    </style>
</head>
<body>

<div class="form-container">
    
    <div id="loginBox">
        <h2 class="section-title">🔐 Accesso Riservato</h2>
        <p>Inserisci la password per sbloccare il registro:</p>
        <input type="password" id="passInput" placeholder="Password...">
        <button onclick="sblocca()">SBLOCCA MODULO</button>
        <p id="err" style="color:red; display:none; margin-top:10px;">Password Errata!</p>
    </div>

    <div id="moduloSegreteria">
        <h2 class="section-title">✏️ Registro Segreteria ITSAR</h2>
        <form id="segreteriaForm">
            <label>ID o Nome Socio (Azienda)</label>
            <input type="text" id="ragioneSociale" required>

            <label>Tipologia Socio</label>
            <select id="tipologiaSocio" required>
                <option value="Socio Partecipante">Socio Partecipante</option>
                <option value="Socio Generico">Socio Generico</option>
                <option value="Progetti Speciali">Progetti Speciali</option>
            </select>

            <label>Data ingresso in ITSAR</label>
            <input type="date" id="dataIngresso" required>

            <label>Data Invio PEC Ammissione</label>
            <input type="date" id="dataInvioPec">

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>1° Sollecito</label>
                    <input type="date" id="dataPrimoSollecito">
                </div>
                <div style="flex: 1;">
                    <label>2° Sollecito</label>
                    <input type="date" id="dataSecondoSollecito">
                </div>
            </div>

            <label>Note Segreteria</label>
            <textarea id="noteSegreteria" rows="3"></textarea>

            <button type="submit" id="submitBtn">SALVA NEL DATABASE</button>
        </form>
        <div id="msg" style="text-align:center; margin-top:15px; font-weight:bold;"></div>
    </div>
</div>

<script>
    // --- IL TUO URL DI GOOGLE (COPIALO DALLA RIGA 68 DEL TUO SCREENSHOT) ---
    const scriptURL = 'INCOLLA_QUI_IL_TUO_URL_DI_GOOGLE'; 
    const PWD_SITO = "drago2026curioso";

    // Funzione che sblocca il modulo e nasconde il login
    function sblocca() {
        const input = document.getElementById('passInput').value;
        if(input === PWD_SITO) {
            document.getElementById('loginBox').style.display = 'none'; // Nasconde login
            document.getElementById('moduloSegreteria').style.display = 'block'; // Mostra modulo
        } else {
            document.getElementById('err').style.display = 'block';
        }
    }

    const form = document.getElementById('segreteriaForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        btn.disabled = true;
        msg.innerText = "⏳ Invio in corso...";
        
        const data = {
            token: "ITSAR_PROTETTO_2024",
            azienda: document.getElementById('ragioneSociale').value,
            tipoSocio: document.getElementById('tipologiaSocio').value,
            dataIngresso: document.getElementById('dataIngresso').value,
            dataPec: document.getElementById('dataInvioPec').value,
            sollecito1: document.getElementById('dataPrimoSollecito').value,
            sollecito2: document.getElementById('dataSecondoSollecito').value,
            note: document.getElementById('noteSegreteria').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', 
            body: JSON.stringify(data)
        })
        .then(() => {
            msg.style.color = "green";
            msg.innerText = "✅ Dati registrati correttamente!";
            form.reset();
            btn.disabled = false;
        })
        .catch(error => {
            msg.style.color = "red";
            msg.innerText = "❌ Errore durante l'invio.";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
