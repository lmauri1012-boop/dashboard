<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Segreteria ITSAR</title>
    <style>
        /* Mantengo il tuo stile originale con qualche piccolo ritocco per la password */
        body { font-family: 'Helvetica Neue', sans-serif; padding: 20px; background: #f0f2f5; }
        .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .section-title { border-bottom: 2px solid #004a99; color: #004a99; padding-bottom: 5px; margin-bottom: 20px; }
        button { background: #004a99; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 25px; }
        button:disabled { background: #ccc; }
        .pw-section { background: #fff9c4; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fbc02d; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 class="section-title">✏️ Registro Segreteria ITSAR</h2>
    
    <div class="pw-section">
        <label style="margin-top:0">Password di Sicurezza</label>
        <input type="password" id="userPassword" placeholder="Inserisci drago2026curioso" required>
    </div>

    <form id="segreteriaForm">
        <label>ID o Nome Socio (Identificativo Azienda)</label>
        <input type="text" id="ragioneSociale" name="ragioneSociale" placeholder="Identificare l'azienda..." required>

        <label>Tipologia Socio</label>
        <select id="tipologiaSocio" name="tipologiaSocio" required>
            <option value="Socio Partecipante">Socio Partecipante</option>
            <option value="Socio Generico">Socio Generico</option>
            <option value="Progetti Speciali">Progetti Speciali</option>
        </select>

        <label>Data ingresso in ITSAR (Ammissione CdA)</label>
        <input type="date" id="dataIngresso" name="dataIngresso" required>

        <label>Data Invio PEC Ammissione</label>
        <input type="date" id="dataInvioPec" name="dataInvioPec">

        <label>Gestione Solleciti (30/60 gg)</label>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <span style="font-size: 0.8rem;">1° Sollecito</span>
                <input type="date" id="dataPrimoSollecito" name="dataPrimoSollecito">
            </div>
            <div style="flex: 1;">
                <span style="font-size: 0.8rem;">2° Sollecito</span>
                <input type="date" id="dataSecondoSollecito" name="dataSecondoSollecito">
            </div>
        </div>

        <label>Note Segreteria</label>
        <textarea id="noteSegreteria" name="noteSegreteria" rows="3"></textarea>

        <button type="submit" id="submitBtn">Aggiorna Registro Soci</button>
    </form>
    <div id="msg" style="text-align:center; margin-top:15px; font-weight:bold;"></div>
</div>

<script>
    // 1. INCOLLA QUI IL TUO NUOVO URL COPIATO (quello che finisce con /exec)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxUUsvVgicJXa23k2c63KhGiIPH0hWCoI5xI4rJi4FS_PdxijU1TTx1C9tbSCHWV3XTXw/exec'; 
    
    // 2. LA PASSWORD CHE ABBIAMO SCELTO
    const PWD_SITO = "drago2026curioso";

    const form = document.getElementById('segreteriaForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // Verifica Password
        const pw = document.getElementById('userPassword').value;
        if(pw !== PWD_SITO) {
            alert("Password Errata!");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        msg.innerText = "Salvataggio in corso...";
        
        // Prepariamo i dati aggiungendo il TOKEN per il ponte Google
        const data = {
            token: "ITSAR_PROTETTO_2024", // Questa sblocca il ponte
            azienda: document.getElementById('ragioneSociale').value,
            tipoSocio: document.getElementById('tipologiaSocio').value,
            dataIngresso: document.getElementById('dataIngresso').value,
            dataPec: document.getElementById('dataInvioPec').value,
            sollecito1: document.getElementById('dataPrimoSollecito').value,
            sollecito2: document.getElementById('dataSecondoSollecito').value,
            note: document.getElementById('noteSegreteria').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', 
            body: JSON.stringify(data)
        })
        .then(() => {
            msg.style.color = "green";
            msg.innerText = "✅ Dati inviati con successo!";
            form.reset();
            document.getElementById('userPassword').value = "";
        })
        .catch(error => {
            msg.style.color = "red";
            msg.innerText = "❌ Errore: " + error.message;
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Aggiorna Registro Soci";
        });
    });
</script>
</body>
</html>
