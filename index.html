<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Fondazione ITSAR</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 10px;
            overflow-x: hidden;
            width: 100%;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; }

        .main-title {
            text-align: center;
            color: #004a99;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            padding: 10px; 
            border: 1px solid #e1e4e8;
            width: 100%;
        }

        .chart-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
            border-left: 3px solid #004a99;
            padding-left: 8px;
        }

        .chart-wrapper { 
            width: 100%; 
            height: 250px; 
            position: relative;
            overflow: hidden; 
            background: #fff;
        }

        iframe { 
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 140% !important; 
            height: 140% !important;
            transform: scale(0.71); 
            transform-origin: 0 0;
            display: block;
        }

        @media (min-width: 800px) {
            .chart-wrapper { height: 350px; }
            iframe { 
                width: 100% !important; 
                height: 100% !important;
                transform: scale(1); 
            }
        }
    </style>
</head>
<body>
