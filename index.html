<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Professionale</title>
    <style>
        /* Base e Sfondo */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 15px;
            color: #333;
        }

        /* Contenitore centrato */
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
        }

        /* Titolo della Dashboard */
        .main-title {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Card dei grafici */
        .card { 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            padding: 18px;
            border: 1px solid #e1e4e8;
            overflow: hidden;
        }

        h2 { 
            color: #1a73e8; 
            font-size: 1.1rem; 
            margin: 0 0 15px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f2f5;
        }

        /* IL TRUCCO PER LO SCORRIMENTO LATERALE */
        .chart-wrapper { 
            width: 100%; 
            overflow-x: auto; /* Permette lo scroll orizzontale */
            -webkit-overflow-scrolling: touch; /* Rende lo scroll fluido su iPhone */
            border-radius: 8px;
        }

        iframe { 
            border: none; 
            width: 100%; 
            min-width: 600px; /* Forza il grafico a non restringersi troppo */
            height: 400px; 
            display: block;
        }

        /* Messaggio di aiuto per l'utente */
        .scroll-hint {
            font-size: 0.8rem;
            color: #999;
            text-align: right;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
