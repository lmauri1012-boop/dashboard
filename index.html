            overflow-x: hidden;
            width: 100%;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; }

            text-align: center;
            color: #004a99;
            margin: 15px 0;

            font-weight: 800;
            text-transform: uppercase;
        }
