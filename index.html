<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Responsive</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 10px;
        }

        .container { 
            max-width: 100%; /* Occupa tutto lo spazio */
            margin: 0 auto; 
        }

        .main-title {
            text-align: center;
            color: #1a73e8;
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            padding: 12px;
            border: 1px solid #e1e4e8;
            overflow: hidden; /* Taglia ciò che esce dai bordi arrotondati */
        }

        h2 { 
            color: #1a73e8; 
            font-size: 1rem; 
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f2f5;
        }

        /* CONTENITORE FLESSIBILE */
        .chart-wrapper { 
            width: 100%; 
            overflow-x: auto; /* Se il grafico è testardo e non si stringe, potrai comunque scorrerlo */
            display: block;
        }

        iframe { 
            border: none; 
            width: 100% !important; /* Forza il grafico a stringersi al 100% della card */
            height: 350px; /* Altezza ottimale per iPhone */
            display: block;
        }

    </style>
</head>
