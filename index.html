    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 10px;
        }
        .container { max-width: 100%; margin: 0 auto; }
        .main-title {
            text-align: center;
            color: #1a73e8;
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            padding: 10px; 
            border: 1px solid #e1e4e8;
            overflow: hidden;
        }
        .chart-wrapper { 
            width: 100%; 
            position: relative;
            overflow: hidden;
            height: 260px; 
        }
        iframe { 
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 165% !important; 
            height: 165% !important;
            transform: scale(0.60); 
            transform-origin: 0 0;
            display: block;
        }
        @media (min-width: 600px) {
            .chart-wrapper { height: 400px; }
            iframe { 
                width: 100% !important; 
                height: 100% !important;
                transform: scale(1); 
            }
        }
    </style>
</head>
