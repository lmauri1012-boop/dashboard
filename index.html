<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Auto-Fit</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 10px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .main-title {
            text-align: center;
            color: #1a73e8;
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            padding: 12px;
            border: 1px solid #e1e4e8;
            overflow: hidden; /* Taglia ciò che esce */
        }

        h2 { 
            color: #1a73e8; 
            font-size: 1rem; 
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f2f5;
        }

        /* IL TRUCCO DELLO ZOOM (SCALE) */
        .chart-wrapper { 
            width: 100%; 
            position: relative;
            overflow: hidden;
            /* Altezza fissa per mobile */
            height: 260px; 
        }

        iframe { 
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
            /* Carichiamo il grafico al 160% della dimensione e poi lo rimpiccioliamo */
            width: 165% !important; 
            height: 165% !important;
            transform: scale(0.60); /* Rimpicciolisce al 60% per farlo stare nel display */
            transform-origin: 0 0;
            display: block;
        }

        /* Se il display è più grande (Tablet o Computer), togliamo lo zoom */
        @media (min-width: 600px) {
            .chart-wrapper { height: 400px; }
            iframe { 
                width: 100% !important; 
                height: 100% !important;
                transform: scale(1); 
            }
        }
    </style>
</head>
