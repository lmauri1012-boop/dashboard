<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Analisi</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f4f7f9; 
            margin: 0; 
            padding: 10px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .main-title {
            text-align: center;
            color: #1a73e8;
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            padding: 10px; /* Ridotto il padding visto che non c'è più il titolo */
            border: 1px solid #e1e4e8;
            overflow: hidden;
        }

        /* IL TRUCCO DELLO ZOOM (SCALE) */
        .chart-wrapper { 
            width: 100%; 
            position: relative;
            overflow: hidden;
            height: 260px; /* Altezza per mobile */
        }

        iframe { 
            border: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 165% !important; 
            height: 165% !important;
            transform: scale(0.60); 
            transform-origin: 0 0;
            display: block;
        }

        /* Se il display è più grande (Tablet o Computer), togliamo lo zoom */
        @media (min-width: 600px) {
            .chart-wrapper { height: 400px; }
            iframe { 
                width: 100% !important; 
                height: 100% !important;
                transform: scale(1); 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">Dashboard Report</div>

    <div class="card">
        <div class="chart-wrapper">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSfJ7h4R1O1c2jq-4nK6CbiAK-HdpedBHyDar-4tWG8KM2oXs7e7VwoleR15JoYsh6V0DBs-kMAxf1Y/pubchart?oid=1320636500&amp;format=interactive"></iframe>
        </div>
    </div>
